  function opaSafeStorage(which){

      const mem=new Map();

  async function rpc(method,body={},token=''){
    if(!cloud) throw new Error('Servidor não configurado. Os números de demonstração não são oficiais.');
    const r=await fetch(`${URL_BASE}/rest/v1/rpc/${method}`,{
      method:'POST',headers:{'Content-Type':'application/json',apikey:API_KEY,...(token?{Authorization:`Bearer ${token}`}:{})},
      body:JSON.stringify(body)
    });
    let data;
    try{data=await r.json()}catch{data=null}

    return data;

  function demoList(){try{return JSON.parse(opaLocal.getItem('opa_demo_entries_v3')||'[]')}catch{return []}}

  function demoWinners(){try{return JSON.parse(opaLocal.getItem('opa_demo_winners_v3')||'[]')}catch{return []}}

  function demoRegister(full_name,shift){
    if(!demoOpen())throw new Error('As inscrições de demonstração estão encerradas.');
    const items=demoList();
    if(items.some(x=>normalName(x.full_name)===normalName(full_name)))throw new Error('Este nome já está cadastrado neste aparelho.');
    if(normalName(full_name)==='administrador de demonstracao')throw new Error('A organização não participa.');
    // Demonstracao: reutiliza a menor lacuna, como o Supabase V12.
    // Apenas cadastros APAGADOS liberam o numero; EXCLUIR mantem o registro.
    const taken=new Set(items.map(x=>Number(x.ticket_no)));
    let ticket_no=1;
    while(taken.has(ticket_no))ticket_no++;
    items.push({ticket_no,full_name,shift,excluded:false,is_admin:false,created_at:new Date().toISOString()});
    setDemoList(items);
    return {ticket_no,full_name,shift};
  }

  function opaSimulationPool(){
    const filtered=state.selectedShifts;
    if(state.simSource==='registered')return (state.adminData?.participants||[]).filter(p=>!p.excluded&&!p.is_admin&&filtered.includes(p.shift));
    return OPA_SAMPLE_NAMES.map((full_name,i)=>({ticket_no:9001+i,full_name:'TESTE — '+full_name,
      shift:OPA_SHIFTS[i%4],excluded:false,is_admin:false})).filter(p=>filtered.includes(p.shift));
  }
  function opaRandIndex(n){
    if(!Number.isInteger(n)||n<=0)throw new Error('Conjunto de participantes inválido.');
    if(!globalThis.crypto?.getRandomValues)throw new Error('Navegador incompatível com a seleção aleatória segura.');
    const d=new Uint32Array(1),range=4294967296,limit=Math.floor(range/n)*n;
    do {globalThis.crypto.getRandomValues(d)}while(d[0]>=limit);
    return d[0]%n;
  }
  function simulateFive(){
    const pool=opaSimulationPool();
    if(pool.length<5){alertError('Selecione turnos com pelo menos cinco participantes para simular.');render();return;}
    const remaining=pool.slice(),winners=[];
    for(let i=0;i<5;i++)winners.push({...remaining.splice(opaRandIndex(remaining.length),1)[0],kit_no:i+1});
    state.simulatedWinners=winners;
    opaStartPresentation('demo',winners,pool);
  }

  function opaPlayDrawEffect(kind){
    if(!audio.enabled)return;
    const field=kind==='roll'?'activeRoll':'activeClaps';
    const track=new Audio(opaRaffleFx[kind]);track.preload='auto';track.volume=kind==='roll'?.72:.85;
    try{opaRaffleFx[field]?.pause();}catch{}
    opaRaffleFx[field]=track;
    track.play().catch(()=>{});
    track.addEventListener('ended',()=>{if(opaRaffleFx[field]===track)opaRaffleFx[field]=null;},{once:true});
  }
  function opaStopDrawEffect(kind){
    const field=kind==='roll'?'activeRoll':'activeClaps';
    try{if(opaRaffleFx[field]){opaRaffleFx[field].pause();opaRaffleFx[field].currentTime=0;}}catch{}
    opaRaffleFx[field]=null;
  }

  function opaSetDrawMusicVolume(){
    if(!audio.bg)return;
    const p=state.drawPresentation;
    if(state.screen==='drawPresentation'&&p)audio.bg.volume=p.phase==='spin'?.13:p.phase==='reveal'?.16:.28;
    else audio.bg.volume=.27;

  function opaTone(freq,duration=0.07,volume=0.025,type='square'){
    if(!audio.enabled)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      if(!opaCtx)opaCtx=new AC();
      if(opaCtx.state==='suspended')opaCtx.resume().catch(()=>{});
      const start=opaCtx.currentTime,osc=opaCtx.createOscillator(),gain=opaCtx.createGain();
      osc.type=type;osc.frequency.setValueAtTime(freq,start);
      gain.gain.setValueAtTime(0.0001,start);
      gain.gain.exponentialRampToValueAtTime(volume,start+0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001,start+duration);
      osc.connect(gain);gain.connect(opaCtx.destination);osc.start(start);osc.stop(start+duration+.02);
    }catch{}
  }
  function opaClaps(){
    if(!audio.enabled)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      if(!opaCtx)opaCtx=new AC();
      if(opaCtx.state==='suspended')opaCtx.resume().catch(()=>{});
      const ctx=opaCtx;
      for(let i=0;i<12;i++){
        const n=Math.round(ctx.sampleRate*.07),buffer=ctx.createBuffer(1,n,ctx.sampleRate),samples=buffer.getChannelData(0);
        for(let j=0;j<n;j++) samples[j]=(Math.random()*2-1)*Math.exp(-8*j/n);
        const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
        source.buffer=buffer;filter.type='bandpass';filter.frequency.value=1300;filter.Q.value=.65;
        gain.gain.value=.07;source.connect(filter);filter.connect(gain);gain.connect(ctx.destination);
        source.start(ctx.currentTime+i*.085+Math.random()*.05);
      }
    }catch{}
  }
  function opaPresentationCleanup(){
    if(opaSpinTimeout){clearTimeout(opaSpinTimeout);opaSpinTimeout=null;}
    if(opaTickTimeout){clearInterval(opaTickTimeout);opaTickTimeout=null;}
    document.querySelectorAll('.opa-burst').forEach(x=>x.remove());
    opaStopDrawEffect('roll');
    opaStopDrawEffect('applause');
    if(audio.bg)audio.bg.volume=.27;
  }
  function opaStartPresentation(mode,raw,spinCandidates){
    // A roleta é ilustrativa: nunca escolhe ou altera os ganhadores.
    // No modo oficial a lista vem apenas do retorno autenticado do Supabase.
    if(!['official','demo'].includes(mode) || !Array.isArray(raw) || raw.length!==5)throw new Error('São necessários cinco resultados válidos.');
    const ids=new Set(raw.map(p=>Number(p.ticket_no)));
    if(ids.size!==5 || raw.some(p=>!Number.isInteger(Number(p.ticket_no))||!p.full_name||p.is_admin))throw new Error('Resultados inválidos ou repetidos.');
    opaPresentationCleanup();
    const winners=raw.slice().sort((a,b)=>(Number(a.kit_no)||0)-(Number(b.kit_no)||0));
    state.drawPresentation={mode,winners,index:0,phase:'ready',spinToken:0,spins:spinCandidates||null,selectedShifts:state.selectedShifts.slice()};
    state.screen='drawPresentation';clearError();render();scrollTop();
  }
  function opaDrawScreen(){
    const p=state.drawPresentation;
    if(!p)return '<section class="opa-present">Apresentação indisponível.</section>';
    const kit=p.index+1,w=p.winners[p.index],spin=p.phase==='spin',revealed=p.phase==='reveal',finished=p.phase==='finished';

    const pillClass=p.mode==='demo'?'sim':'';
    const finishList=p.winners.map(x=>`<div><strong>${ticketLabel(x.ticket_no)}</strong><span>${escapeHtml(x.full_name)}</span><small>Kit ${Number(x.kit_no)} · ${escapeHtml(x.shift)}</small></div>`).join('');
    const soundLabel=audio.enabled?'🔊 Som ligado':'🔇 Ativar som';
    return `<section class="opa-present" aria-label="Apresentação do sorteio em tela única">
      <div class="opa-p-body ${finished?'opa-p-body--done':''}">
        <header class="opa-p-top">
          <span class="opa-p-brand">LEÃO · CIPA / SHE<br>MISSÃO OPA</span>
          <div class="opa-p-toolbar">
            <button class="opa-p-sound" data-action="draw-sound" type="button" aria-pressed="${audio.enabled}">${soundLabel}</button>
            <button data-action="draw-fullscreen" type="button" title="Expandir a apresentação para a TV">⛶ Tela cheia</button>
            <button data-action="draw-exit" type="button">✕ Sair</button>
          </div>
        </header>
        <div class="opa-p-header">
          <div class="opa-p-pill ${pillClass}">${p.mode==='demo'?'🧪':'🏆'} ${status}</div>
          ${finished?`<h1 class="opa-p-title">🎉 5 kits revelados!</h1><p class="opa-p-sub">${p.mode==='demo'?'Simulação encerrada — nenhum ganhador foi gravado.':'Resultados oficiais registrados pelo Supabase.'}</p>`:
          `<h1 class="opa-p-title">${spin?'A roleta está girando…':revealed?'TEMOS UM CONTEMPLADO!':'Quem será o próximo?'}</h1>
           <p class="opa-p-sub">Kit ${kit} de 5 · ${p.mode==='demo'?'Simulação':'Participantes elegíveis'}</p>
           <div class="opa-p-progress">${p.winners.map((_,i)=>`<span class="${i<p.index?'done':i===p.index?'current':''}">Kit ${i+1}${i<p.index?' ✓':''}</span>`).join('')}</div>`}
        </div>
        ${finished?`<div class="opa-p-finish-stage"><div class="opa-p-roundup">${finishList}</div></div>`:
        `<div class="opa-p-stage">
          <div class="opa-p-wheel-col">
            <div class="opa-wheel-area"><div class="opa-wheel-wrap"><div class="opa-wheel ${spin?'spin':revealed?'':'wait'}"><div class="opa-wheel-word">OPA!</div></div><div class="opa-pointer"></div></div></div>
            ${spin?'<div class="opa-p-counter" id="opa-digit" aria-live="off">0000</div>':revealed?'<div class="opa-p-counter"><span class="muted">SORTEADO ✓</span></div>':'<div class="opa-p-counter"><span class="muted">PRONTO PARA GIRAR</span></div>'}
          </div>
          <div class="opa-p-win-col">
            <div class="opa-gift ${revealed?'open':''}"><div class="opa-gift-lid"></div><div class="opa-gift-box"><span class="opa-gift-mark">LEÃO</span></div></div>
            ${revealed?`<div class="opa-p-result" role="status" aria-live="polite"><small>🎁 KIT ${kit} · NÚMERO CONTEMPLADO</small><div class="opa-p-number">${ticketLabel(w.ticket_no)}</div><div class="opa-p-name">${escapeHtml(w.full_name)}</div><div class="opa-p-shift">${escapeHtml(w.shift)}</div></div>`:
            `<p class="opa-p-await">${spin?'Sorteando...':'A caixa vai se abrir para revelar o próximo ganhador.'}</p>`}
          </div>
        </div>`}
        <div class="opa-p-actions">
          ${finished?`<button type="button" class="opa-p-primary" data-action="draw-exit">VOLTAR AO PAINEL</button><button type="button" class="opa-p-secondary" data-action="draw-again">↺ REVER ANIMAÇÃO</button>`:
          p.phase==='ready'?`<button type="button" class="opa-p-primary" data-action="draw-spin">🎡 GIRAR PARA REVELAR O KIT ${kit}</button>`:
          p.phase==='spin'?'<button type="button" class="opa-p-primary" disabled>GIRANDO… 🔊</button>':
          `<button type="button" class="opa-p-primary" data-action="draw-next">${kit===5?'🏆 VER OS 5 CONTEMPLADOS':'➡ PRÓXIMO KIT'}</button>`}
        </div>
        <p class="opa-p-caption">${p.mode==='demo'?'Simulação: não grava resultados nem fecha inscrições.':'Oficial: resultados definidos e gravados pelo Supabase.'} A roleta apenas apresenta os ganhadores.</p>
      </div></section>`;
  }
  function opaBurst(){
    document.querySelectorAll('.opa-burst').forEach(x=>x.remove());
    const root=document.createElement('div');root.className='opa-burst';
    const shades=['#e8f3a8','#b6e08c','#6bce9d','#ddc56d','#efffcf','#fff'];
    for(let i=0;i<54;i++){
      const part=document.createElement('i');
      part.style.left=(Math.random()*100)+'%';part.style.background=shades[i%shades.length];
      part.style.animationDelay=(Math.random()*.48)+'s';part.style.setProperty('--sway',`${Math.round(Math.random()*180-90)}px`);
      root.appendChild(part);
    }
    document.body.appendChild(root);setTimeout(()=>root.remove(),3600);
  }
  function opaSpin(){
    const p=state.drawPresentation;
    if(!p||state.screen!=='drawPresentation'||p.phase!=='ready')return;
    opaPresentationCleanup();
    p.phase='spin';p.spinToken++;
    const token=p.spinToken;
    if(audio.enabled)startMusic();
    if(audio.bg)audio.bg.volume=.13;
    render();
    opaPlayDrawEffect('roll');
    const pool=p.spins||(state.adminData?.participants||[]).filter(x=>!x.excluded&&!x.is_admin&&p.selectedShifts.includes(x.shift));
    let ticks=0;
    opaTickTimeout=setInterval(()=>{
      if(state.screen!=='drawPresentation'||!state.drawPresentation||state.drawPresentation.spinToken!==token){opaPresentationCleanup();return;}
      const shown=pool.length?pool[ticks%pool.length].ticket_no:((ticks*37)%9999)+1;
      const el=document.getElementById('opa-digit');if(el)el.textContent=ticketLabel(shown);
      ticks++;opaTone(660+Math.min(400,ticks*9),.045,.012);
    },82);
    opaSpinTimeout=setTimeout(()=>{
      opaPresentationCleanup();
      if(state.screen!=='drawPresentation'||!state.drawPresentation||state.drawPresentation.spinToken!==token)return;
      state.drawPresentation.phase='reveal';render();opaBurst();
      opaPlayDrawEffect('applause');
      playSfx('good');opaClaps();
      if(state.drawPresentation.index===4)playSfx('finish');
    },4200);
  }
  function opaNext(){
    const p=state.drawPresentation;
    if(!p||p.phase!=='reveal')return;
    if(p.index===4){p.phase='finished';render();opaBurst();opaPlayDrawEffect('applause');opaClaps();}
    else{p.index++;p.phase='ready';render();}
    scrollTop();
  }
  function opaClose(){opaPresentationCleanup();state.drawPresentation=null;state.screen='adminDashboard';render();scrollTop();}

  function adminDashboardView(){

    function adminListHtml(){
    if(!state.adminData)return '<div class="empty">Carregando...</div>';
    const q=normalName(state.search);
    const filtered=state.adminData.participants.filter(x=> (state.shiftFilter==='all'||x.shift===state.shiftFilter) && (!q||normalName(x.full_name).includes(q)||ticketLabel(x.ticket_no).includes(q)));
    if(!filtered.length)return '<div class="empty">Nenhum participante encontrado.</div>';
    return filtered.map(p=>`<div class="participant ${p.excluded||p.is_admin?'excluded':''}"><div class="personinfo"><strong>🎟 ${ticketLabel(p.ticket_no)} · ${escapeHtml(p.full_name)}</strong><small>${escapeHtml(p.shift)}${p.is_admin?' · ⛔ ADMINISTRADOR':''}${p.excluded?' · EXCLUÍDO':''}${isTestParticipant(p)?' · 🧪 TESTE':''}</small></div><div class="participant-actions"><button class="tag ${p.excluded?'active':''}" type="button" data-action="exclude" data-ticket="${p.ticket_no}" ${state.adminData.winners.length||p.is_admin||state.busy?'disabled':''}>${p.is_admin?'ADMIN':p.excluded?'REINCLUIR':'EXCLUIR'}</button><button class="tag-delete" type="button" data-action="delete-participant" data-ticket="${p.ticket_no}" ${state.adminData.winners.length||state.busy?'disabled':''} aria-label="Apagar definitivamente o cadastro de ${escapeHtml(p.full_name)} número ${ticketLabel(p.ticket_no)}">APAGAR</button></div></div>`).join('');
  }

    }
    btn.classList.toggle('off',!audio.enabled);

  }

  function setupAudio(){
    if(audio.bg) return;
    audio.bg=new Audio(MUSIC_SRC);
    audio.bg.loop=true;
    audio.bg.volume=.27;
    audio.bg.preload='auto';
  }
  function startMusic(){
    if(!audio.enabled)return;
    setupAudio();
    const result=audio.bg.play();
    if(result&&typeof result.then==='function')result.then(()=>{audio.active=true;ensureAudioButton()}).catch(()=>{audio.active=false;ensureAudioButton();});
  }
  function stopMusic(){if(audio.bg){audio.bg.pause();audio.bg.currentTime=0;}audio.active=false;ensureAudioButton();}
  function unlockAudio(){startMusic();}
  function playSfx(kind){
    if(!audio.enabled)return;
    const source=FX_SRC[kind];if(!source)return;
    const clip=new Audio(source);clip.volume=kind==='finish'?0.85:0.82;
    const result=clip.play();if(result&&typeof result.catch==='function')result.catch(()=>{});
  }
  function toggleAudio(force){
    audio.enabled=typeof force==='boolean'?force:!audio.enabled;
    opaLocal.setItem('opa_audio_v9',String(audio.enabled));
    if(audio.enabled){startMusic();playSfx('good');}else stopMusic();
    ensureAudioButton();
  }
  function clearCelebration(){document.querySelectorAll('.celebration-overlay').forEach(el=>el.remove());}
  function launchCelebration(){
    clearCelebration();
    const overlay=document.createElement('div');overlay.className='celebration-overlay';
    const colors=['#ffdc4a','#ff6db2','#65e7ff','#7bff98','#8f7dff','#ff9a3d'];
    for(let i=0;i<68;i++){
      const c=document.createElement('span');c.className='confetti';
      c.style.left=(Math.random()*100)+'vw';c.style.background=colors[i%colors.length];
      c.style.animationDelay=(Math.random()*0.6)+'s';c.style.transform=`rotate(${Math.random()*360}deg)`;
      overlay.appendChild(c);
    }
    [[20,22],[80,24],[28,42],[73,38],[50,18]].forEach(([x,y],i)=>{
      const f=document.createElement('span');f.className='firework';
      f.style.left=x+'vw';f.style.top=y+'vh';
      f.style.animationDelay=(i*0.18)+'s';
      f.style.background=colors[(i+1)%colors.length];
      overlay.appendChild(f);
    });
    document.body.appendChild(overlay);
    setTimeout(clearCelebration,3600);
    playSfx('finish');
  }
  function maybeCelebrateReceipt(){
    const key=state.receipt?.ticket_no;
    if(state.screen==='receipt' && key!=null && key!==celebrationKey){
      celebrationKey=key;
      launchCelebration();
    }
  }

  function render(){
    document.body.classList.toggle('opa-show-present',state.screen==='drawPresentation');
    document.body.classList.toggle('opa-ux-entry',state.screen==='splash');
    document.body.classList.toggle('opa-ux-play',state.screen==='scene');
    ensureAudioButton();
    if(state.screen==='splash')app.innerHTML=splashView();
    if(state.screen==='intro')app.innerHTML=cover();
    if(state.screen==='scene'){
      if(state.phase==='context')app.innerHTML=contextView();
      else if(state.phase==='observe')app.innerHTML=sceneOnlyView();
      else if(state.phase==='identified')app.innerHTML=observedView();
      else if(state.phase==='question')app.innerHTML=questionView();
      else if(state.phase==='feedback')app.innerHTML=feedbackView();
    }
    if(state.screen==='register')app.innerHTML=registerView();
    if(state.screen==='receipt')app.innerHTML=receiptView();
    if(state.screen==='adminLogin')app.innerHTML=adminLoginView();
    if(state.screen==='adminDashboard')app.innerHTML=adminDashboardView();
    if(state.screen==='drawPresentation')app.innerHTML=opaDrawScreen();
    opaSetDrawMusicVolume();
    ensureAudioButton();
    const audioButton=document.getElementById('audio-toggle');
    if(audioButton)audioButton.style.display=state.screen==='drawPresentation'?'none':'';
    maybeCelebrateReceipt();
  }

  function advance(){if(state.index<2){state.index++;state.phase='context';state.choice=null;state.screen='scene';}
    else{state.screen=state.receipt?'receipt':'register';}render();scrollTop();}

  async function submitRegistration(){
    const full_name=state.formName.trim().replace(/\s+/g,' '),shift=state.formShift;
    if(full_name.length<5||full_name.length>100||full_name.split(' ').length<2||/[0-9]/.test(full_name)){
      alertError('Informe nome e sobrenome completos, sem números.');render();return;
    }
    if(!['Turno 1','Turno 2','Turno 3','ADM'].includes(shift)){alertError('Selecione o turno em que você trabalha.');render();return;}
    if(!state.formConsent){alertError('Para registrar sua participação, confirme o uso de seu nome e turno conforme o aviso acima.');render();return;}
    state.busy=true;clearError();render();
    try{
      const data=cloud?await rpc('opa_register',{p_full_name:full_name,p_shift:shift}):demoRegister(full_name,shift);
      state.receipt={...data,cloud};opaLocal.setItem('opa_receipt_v3',JSON.stringify(state.receipt));
      state.screen='receipt';
    }catch(e){alertError(e?.message||'Não foi possível concluir a inscrição. Confira a conexão.');}
    finally{state.busy=false;render();scrollTop();}
  }
  async function submitAdminLogin(email,password){
    state.busy=true;clearError();render();
    try{
      if(!cloud){
        if(cloudRequired)throw new Error('Configuração do banco de dados pendente.');
        if(email!=='demo@opa.local'||password!=='DEMO-OPA-2026')throw new Error('Login de demonstração incorreto.');
        state.token='demo';
      } else {
        const r=await fetch(`${URL_BASE}/auth/v1/token?grant_type=password`,{method:'POST',headers:{'Content-Type':'application/json',apikey:API_KEY},body:JSON.stringify({email,password})});
        const j=await r.json();
        if(!r.ok||!j.access_token)throw new Error('E-mail ou senha incorretos.');
        state.token=j.access_token;
      }
      state.adminData=cloud?await rpc('opa_admin_dashboard',{},state.token):demoDashboard();
      opaSession.setItem('opa_admin_token_v3',state.token);
      state.screen='adminDashboard';
    }catch(e){state.token='';opaSession.removeItem('opa_admin_token_v3');alertError(e?.message||'Erro no login.');}
    finally{state.busy=false;render();scrollTop();}
  }
  async function refreshAdmin(){state.adminData=cloud?await rpc('opa_admin_dashboard',{},state.token):demoDashboard()}
  async function adminMutation(action,params={}){
    state.simulatedWinners=[];
    state.busy=true;clearError();render();
    try{
      if(cloud){
        if(action==='exclude')await rpc('opa_admin_exclude',{p_ticket_no:params.ticket,p_excluded:params.excluded},state.token);
        if(action==='delete')await rpc('opa_admin_delete',{p_ticket_no:params.ticket},state.token);
        if(action==='toggle')await rpc('opa_admin_toggle_registration',{p_open:params.open},state.token);
        if(action==='draw')await rpc('opa_admin_draw',{p_shifts:params.shifts},state.token);
        if(action==='reset')await rpc('opa_admin_reset_test_draw',{p_confirmation:'REINICIAR TESTE OPA'},state.token);
        if(action==='new-round')await rpc('opa_admin_new_round',{p_confirmation:'NOVA RODADA OPA'},state.token);
        if(action==='go-live')await rpc('opa_admin_go_live',{p_confirmation:'ATIVAR SORTEIO OFICIAL'},state.token);
      }else{
        if(action==='reset'){opaLocal.removeItem('opa_demo_winners_v3');opaLocal.setItem('opa_demo_open_v3','true');}
        if(action==='new-round'){
          const saved=demoWinners();
          if(saved.length!==5)throw new Error('A rodada atual precisa ter cinco ganhadores registrados.');
          const history=demoRoundHistory();
          history.push({round_no:history.length+1,archived_at:new Date().toISOString(),winners:saved});
          opaLocal.setItem('opa_demo_draw_history_v17',JSON.stringify(history));
          opaLocal.removeItem('opa_demo_winners_v3');
        }
        if(action==='go-live')throw new Error('Ativação oficial disponível somente no Supabase real.');
        if(action==='exclude'){
          if(demoWinners().length)throw new Error('O sorteio já foi realizado.');
          const items=demoList(),person=items.find(x=>x.ticket_no===params.ticket);
          if(!person)throw new Error('Número não encontrado.');
          person.excluded=params.excluded;setDemoList(items);
        }
        if(action==='delete'){
          if(demoWinners().length)throw new Error('O sorteio já foi realizado. Não é possível apagar participantes.');
          const items=demoList();
          const rest=items.filter(x=>Number(x.ticket_no)!==Number(params.ticket));
          if(rest.length===items.length)throw new Error('Número não encontrado.');
          setDemoList(rest);
        }
        if(action==='toggle'){
          if(demoWinners().length)throw new Error('O sorteio já foi realizado.');
          opaLocal.setItem('opa_demo_open_v3',String(params.open));
        }
        if(action==='draw'){
          if(demoOpen())throw new Error('Feche as inscrições primeiro.');
          if(!demoWinners().length){
            const list=demoList().filter(x=>!x.excluded&&!x.is_admin&&params.shifts.includes(x.shift));
            if(list.length<5)throw new Error('Precisa de pelo menos 5 inscritos elegíveis.');
            // Demonstration only: browser-generated choices, NOT a production draw.
            const picks=[];
            while(picks.length<5){const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);const max=Math.floor(4294967296/list.length)*list.length;
              if(bytes[0]>=max)continue;const pos=bytes[0]%list.length;picks.push(list.splice(pos,1)[0]);}
            opaLocal.setItem('opa_demo_winners_v3',JSON.stringify(picks.map((p,i)=>({...p,kit_no:i+1}))));
          }
        }
      }
      await refreshAdmin();
      if(action==='draw'){
        // Official winners MUST be read back from the authenticated database.
        const saved=state.adminData?.winners;
        if(!Array.isArray(saved)||saved.length!==5)throw new Error('O resultado não foi confirmado pelo painel. Verifique o banco antes de qualquer nova tentativa.');
        opaStartPresentation('official',saved);
      }
    }catch(e){alertError(e?.message||'Operação não concluída.');}
    finally{state.busy=false;render();}
  }
  app.addEventListener('input',e=>{
    if(e.target.id==='fullname')state.formName=e.target.value;
    if(e.target.id==='consent')state.formConsent=e.target.checked;
    if(e.target.id==='shift')state.formShift=e.target.value;
    if(e.target.id==='admin-search'){state.search=e.target.value;const list=document.getElementById('admin-list');if(list)list.innerHTML=adminListHtml();}
  });
  app.addEventListener('change',e=>{
    if(e.target.id==='shift')state.formShift=e.target.value;
    if(e.target.id==='consent')state.formConsent=e.target.checked;
    if(e.target.id==='admin-filter'){state.shiftFilter=e.target.value;const list=document.getElementById('admin-list');if(list)list.innerHTML=adminListHtml();}
    if(e.target.matches('[data-opa-shift]')){const sh=e.target.dataset.opaShift;state.selectedShifts=e.target.checked?OPA_SHIFTS.filter(x=>state.selectedShifts.includes(x)||x===sh):state.selectedShifts.filter(x=>x!==sh);state.simulatedWinners=[];render();}
    if(e.target.id==='opa-sim-source'){state.simSource=e.target.value;state.simulatedWinners=[];render();}
  });
  app.addEventListener('submit',e=>{
    if(e.target.id==='register-form'){e.preventDefault();submitRegistration()}
    if(e.target.id==='admin-login-form'){
      e.preventDefault();const email=e.target.querySelector('#email').value.trim();const password=e.target.querySelector('#password').value;
      submitAdminLogin(email,password)
    }
  });
  app.addEventListener('click',async e=>{
    const b=e.target.closest('button[data-action]');if(!b||b.disabled||state.busy)return;
    const a=b.dataset.action;
    unlockAudio();
    if(a==='test-audio'){if(!audio.enabled)audio.enabled=true;opaLocal.setItem('opa_audio_v9','true');startMusic();playSfx('good');ensureAudioButton();b.textContent='✓ SOM ATIVADO — VOLUME DO CELULAR';}
    // A abertura animada avança para a apresentação, não reinicia o splash.
    else if(a==='open-intro'&&state.registrationOpen){playSfx('next');state.screen='scene';state.index=0;state.choice=null;state.phase='context';render();scrollTop();}
    else if(a==='start'&&state.registrationOpen){playSfx('next');state.screen='scene';state.index=0;state.choice=null;state.phase='context';render();scrollTop();}
    else if(a==='to-scene'&&state.screen==='scene'&&state.phase==='context'){playSfx('next');state.phase='observe';render();scrollTop();}
    else if(a==='show-error'&&state.screen==='scene'&&state.phase==='observe'){playSfx('tap');state.phase='identified';render();scrollTop();}
    else if(a==='to-question'&&state.screen==='scene'&&state.phase==='identified'){playSfx('next');state.phase='question';render();scrollTop();document.getElementById('decision')?.scrollIntoView({block:'start'});}
    else if(a==='choose'&&state.screen==='scene'&&state.phase==='question'){
      state.choice=Number(b.dataset.choice);state.results[state.index]=scenes[state.index].choices[state.choice].ok;
      playSfx(scenes[state.index].choices[state.choice].ok?'good':'bad');state.phase='feedback';render();scrollTop();
    }else if(a==='next'&&state.screen==='scene'&&state.phase==='feedback'){playSfx(state.index===2?'win':'next');advance();}
    else if(a==='view-ticket'){playSfx('tap');state.screen='receipt';render();scrollTop()}
    else if(a==='another-person'){
      state.receipt=null;celebrationKey=null;clearCelebration();opaLocal.removeItem('opa_receipt_v3');state.formName='';state.formShift='';state.formConsent=false;
      state.screen='intro';render();scrollTop();
    }else if(a==='copy-ticket'){playSfx('tap');
      const r=state.receipt;
      const text=`Missão OPA — Número ${ticketLabel(r.ticket_no)} — ${r.full_name} — ${r.shift}${cloud?'':' [DEMONSTRAÇÃO]'}`;
      try{await navigator.clipboard.writeText(text);b.textContent='✓ NÚMERO COPIADO!'}catch{b.textContent='Número: '+ticketLabel(r.ticket_no)}
    }else if(a==='logout'){playSfx('tap');state.token='';opaSession.removeItem('opa_admin_token_v3');state.adminData=null;state.screen='adminLogin';render();}
    else if(a==='simulate-draw'){simulateFive();}
    else if(a==='pick-all-shifts'){state.selectedShifts=OPA_SHIFTS.slice();state.simulatedWinners=[];render();}
    else if(a==='new-round'){
      const round=Number(state.adminData?.active_round)||1;
      const reply=window.prompt(`Iniciar a RODADA ${round+1}?\n\nOs cinco vencedores da rodada ${round} serão arquivados no histórico. Nenhum cadastro será apagado. As inscrições NÃO serão reabertas automaticamente.\n\nATENÇÃO: uma nova rodada oficial é um novo sorteio registrado; não modifica o resultado antigo.\n\nDigite NOVA RODADA OPA para confirmar.`);
      if(reply==='NOVA RODADA OPA')await adminMutation('new-round');
      else if(reply!==null){alertError('Confirmação incorreta. O resultado anterior foi preservado.');render();}
    }
    else if(a==='reset-test'){
      const msg='Reiniciar SOMENTE a rodada de teste do Supabase? Os vencedores atuais serão arquivados, o resultado ativo apagado e as inscrições reabertas. NÃO apaga participantes. Digite REINICIAR TESTE OPA para confirmar.';
      const response=window.prompt(msg);
      if(response==='REINICIAR TESTE OPA')await adminMutation('reset');
      else if(response!==null){alertError('Confirmação incorreta. Nenhum resultado foi alterado.');render();}
    }
    else if(a==='go-live'){
      const response=window.prompt('ATENÇÃO: ativa o sorteio REAL e impede reiniciar resultados pelo painel. Antes, remova participantes fictícios. Digite ATIVAR SORTEIO OFICIAL para continuar.');
      if(response==='ATIVAR SORTEIO OFICIAL')await adminMutation('go-live');
      else if(response!==null){alertError('Ativação cancelada.');render();}
    }
    else if(a==='draw-show-official'){
      const saved=state.adminData?.winners;
      if(Array.isArray(saved)&&saved.length===5){try{opaStartPresentation('official',saved)}catch(err){alertError(err.message);render();}}
    }
    else if(a==='draw-sound'){opaDrawSoundToggle();}
    else if(a==='draw-fullscreen'){opaDrawFullscreen();}
    else if(a==='draw-spin'){opaSpin();}
    else if(a==='draw-next'){opaNext();}
    else if(a==='draw-exit'){opaClose();}
    else if(a==='draw-again'){
      if(state.drawPresentation){opaPresentationCleanup();state.drawPresentation.index=0;state.drawPresentation.phase='ready';render();scrollTop();}
    }
    else if(a==='toggle-open'){
      const willOpen=!state.adminData.registration_open;
      const ok=confirm(willOpen?'Reabrir as inscrições para os quatro grupos?':'Fechar as inscrições agora? Ninguém mais poderá receber número até reabri-las.');
      if(ok)await adminMutation('toggle',{open:willOpen});
    }else if(a==='exclude'){
      const ticket=Number(b.dataset.ticket),person=state.adminData.participants.find(x=>x.ticket_no===ticket);
      if(person&&confirm(`${person.excluded?'Reincluir':'Excluir'} ${person.full_name} (#${ticketLabel(ticket)}) do sorteio?`))
        await adminMutation('exclude',{ticket,excluded:!person.excluded});
    }else if(a==='delete-participant'){
      const ticket=Number(b.dataset.ticket);
      const person=state.adminData?.participants.find(x=>Number(x.ticket_no)===ticket);
      if(person){
        const expected=ticketLabel(ticket);
        const typed=window.prompt(`Apagar DEFINITIVAMENTE o cadastro de ${person.full_name} (nº ${expected})?\n\nIsso não poderá ser desfeito. O número ficará disponível para outro cadastro. Digite o número ${expected} para confirmar.`);
        if(typed!==null){
          if(typed.trim()!==expected){alertError('Número de confirmação incorreto. Nenhum cadastro foi apagado.');render();}
          else await adminMutation('delete',{ticket});
        }
      }
    }else if(a==='draw'){
      if(state.adminData?.participants?.some(isTestParticipant)){
        alertError('Sorteio oficial bloqueado: apague todos os cadastros TESTE OPA antes de realizar o sorteio definitivo.');render();
      }else if(!state.selectedShifts.length){alertError('Selecione pelo menos um turno.');render();}
      else if(confirm('CONFIRMAR SORTEIO OFICIAL: 5 kits entre os grupos '+state.selectedShifts.join(', ')+'. Os nomes serão gravados definitivamente no banco. Prosseguir?'))
        await adminMutation('draw',{shifts:state.selectedShifts.slice()});
    }
  });
  async function init(){
    if(adminMode){
      if(state.token){try{state.adminData=cloud?await rpc('opa_admin_dashboard',{},state.token):state.token==='demo'?demoDashboard():null;
        if(state.adminData)state.screen='adminDashboard';}catch{state.token='';opaSession.removeItem('opa_admin_token_v3');}}
    } else await getStatus();
    render();
    ensureAudioButton();
  }
  init();
})();
</script>
</body>
</html>
